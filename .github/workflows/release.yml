name: Release

# Push a version tag (git tag -a v0.1.0 -m "What's new…" && git push origin v0.1.0),
# or run this workflow from the Actions tab with the release notes, to build,
# sign and upload the desktop apps to a draft GitHub release. A run from the
# Actions tab tags main's version when the draft is published.
# Nothing reaches anyone until the draft is published. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: What's new in this version (shown in the app)
        required: true

permissions:
  contents: write

jobs:
  # One job makes (or reuses) the draft release before the builds start, so
  # the four builds upload to the same draft instead of racing to make one each.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key is set up
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. See RELEASING.md."
            exit 1
          fi
          if grep -q REPLACE_WITH src-tauri/tauri.conf.json; then
            echo "::error::The updater's public key is still a placeholder in src-tauri/tauri.conf.json. See RELEASING.md."
            exit 1
          fi

      - name: Check the tag matches the app's version
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the app's version is $version. Run: npm run set-version -- ${GITHUB_REF_NAME#v}"
            exit 1
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the release notes
        id: notes
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo 'body<<END_OF_NOTES'
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              printf '%s\n' "$NOTES"
            else
              git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
              git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d'
            fi
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Make the draft release, or reuse one for this tag
        id: draft
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const { TAG: tag, NOTES: body } = process.env;
            const name = `Cookbook ${tag}`;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const published = releases.find((r) => r.tag_name === tag && !r.draft);
            if (published) return core.setFailed(`${tag} is already published. Set a new version first. See RELEASING.md.`);
            const draft = releases.find((r) => r.tag_name === tag && r.draft);
            const { data } = draft
              ? await github.rest.repos.updateRelease({ ...context.repo, release_id: draft.id, name, body })
              : await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, target_commitish: context.sha, name, body, draft: true });
            core.setOutput('id', data.id);

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple silicon, os: macos-latest, args: --target aarch64-apple-darwin, rust-targets: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-latest, args: --target x86_64-apple-darwin, rust-targets: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, args: '', rust-targets: '' }
          - { name: Linux, os: ubuntu-22.04, args: '', rust-targets: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ needs.draft.outputs.tag }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          args: ${{ matrix.args }}

  # The Android app, as one APK for ARM phones and tablets (64- and 32-bit), signed with the
  # project's Android key so each version installs over the last. Until that key is set up
  # (RELEASING.md), this job says so and is skipped, and the desktop release goes ahead without it.
  android:
    name: Android
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Android signing key is set up
        id: key
        shell: bash
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::No Android APK in this release: the ANDROID_KEYSTORE_BASE64 secret is missing. See RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.ready == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: src-tauri
          key: android
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.key.outputs.ready == 'true'

      - name: Put the signing key in place
        if: steps.key.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cookbook-android.jks"
          {
            echo "storeFile=$RUNNER_TEMP/cookbook-android.jks"
            echo "keyAlias=${KEY_ALIAS:-cookbook}"
            echo "password=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        if: steps.key.outputs.ready == 'true'
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 armv7 --ci

      - name: Name the APK
        if: steps.key.outputs.ready == 'true'
        id: apk
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "Cookbook_${version}_android.apk"
          echo "file=Cookbook_${version}_android.apk" >> "$GITHUB_OUTPUT"

      - name: Add the APK to the draft release
        if: steps.key.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          FILE: ${{ steps.apk.outputs.file }}
          RELEASE: ${{ needs.draft.outputs.id }}
        with:
          script: |
            const fs = require('fs');
            const { FILE: name, RELEASE: id } = process.env;
            const release_id = Number(id);
            // A second run for the same tag replaces the APK rather than failing on its name.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id });
            for (const old of assets.filter((a) => a.name === name)) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id, name, data: fs.readFileSync(name), headers: { 'content-type': 'application/vnd.android.package-archive' } });
