name: Release

# Push a version tag (git tag -a v0.1.0 -m "What's new…" && git push origin v0.1.0)
# to build, sign and upload the desktop apps to a draft GitHub release.
# Nothing reaches anyone until the draft is published. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple silicon, os: macos-latest, args: --target aarch64-apple-darwin, rust-targets: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-latest, args: --target x86_64-apple-darwin, rust-targets: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, args: '', rust-targets: '' }
          - { name: Linux, os: ubuntu-22.04, args: '', rust-targets: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key is set up
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. See RELEASING.md."
            exit 1
          fi
          if grep -q REPLACE_WITH src-tauri/tauri.conf.json; then
            echo "::error::The updater's public key is still a placeholder in src-tauri/tauri.conf.json. See RELEASING.md."
            exit 1
          fi

      - name: Check the tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the app's version is $version. Run: npm run set-version -- ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Read the release notes from the tag
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo 'body<<END_OF_NOTES'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d'
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cookbook ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}
